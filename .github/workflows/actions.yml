# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in tests/*_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          # e_machine field of the ELF header: 3e00 is x86-64, b700 is aarch64.
          # Quoted, since YAML reads an unquoted 3e00 as the number 3.
          - runner: ubuntu-24.04
            elf: "3e00"
          - runner: ubuntu-24.04-arm
            elf: "b700"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          ELF: ${{ matrix.elf }}
        run: |
          version=$(awk '/^  version:/ { found = 1 } found && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
          [[ "$(command -v crane)" == "${HOME}/bin/crane" ]]
          od -An -tx1 -j18 -N2 "${HOME}/bin/crane" | tr -d ' \n' | grep -Fx "${ELF}"
          echo "Expected ${version}, installed $(crane version)"
          [[ "$(crane version)" == "${version}" ]]
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v crane)" == "${SECOND}/crane" ]]
          crane version
      # A real release the checksum table doesn't list.
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.12.0
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/crane" ]]

  # A fresh runner with the release's download hosts blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download hosts
        run: |
          echo "127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://github.com; then
            echo "github.com is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: |
          [[ "$(command -v crane)" == "${HOME}/bin/crane" ]]
          crane version

  # test-deploy.yml's registry-test: every action against a local registry:2
  # that requires a login, over plain HTTP, for crane 0.15.1 (the oldest with
  # auth logout) and for the install action's default. The source is pinned
  # to the digest its tag points to when the job starts.
  registry:
    strategy:
      fail-fast: false
      matrix:
        crane_version: ["0.15.1", "default"]
    runs-on: ubuntu-24.04
    env:
      REGISTRY_HOST: localhost:5000
      # Placeholder credentials for the throwaway registry. login reads them
      # from the variables its username and password inputs name.
      REGISTRY_USER: ci-user
      REGISTRY_SECRET: ci-password
      SOURCE_IMAGE: cgr.dev/chainguard/static:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a registry that requires a login
        run: |
          # mirror.gcr.io serves the Docker Hub images without Docker Hub's
          # anonymous pull limits. A pull from it can time out, so pull with
          # retries before running them.
          for image in mirror.gcr.io/library/httpd:2 mirror.gcr.io/library/registry:2; do
            for attempt in 1 2 3; do
              docker pull "${image}" && break
              sleep $((attempt * 10))
            done
          done
          mkdir -p "${RUNNER_TEMP}/registry-auth"
          docker run --rm --entrypoint htpasswd mirror.gcr.io/library/httpd:2 -Bbn "${REGISTRY_USER}" "${REGISTRY_SECRET}" \
            > "${RUNNER_TEMP}/registry-auth/htpasswd"
          docker run -d --name registry -p 5000:5000 -v "${RUNNER_TEMP}/registry-auth:/auth" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=crane-orb-ci \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd mirror.gcr.io/library/registry:2
          # A 401 means the registry is up and refuses anonymous requests.
          for _ in $(seq 1 30); do
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' "http://${REGISTRY_HOST}/v2/")" == "401" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "The registry did not start."
          docker logs registry
          exit 1
      - if: matrix.crane_version == 'default'
        uses: ./actions/install
      - if: matrix.crane_version != 'default'
        uses: ./actions/install
        with:
          version: ${{ matrix.crane_version }}
      - name: Verify the crane version
        env:
          EXPECTED_VERSION: ${{ matrix.crane_version }}
        run: |
          if [[ "${EXPECTED_VERSION}" == "default" ]]; then
            EXPECTED_VERSION=$(awk '/^  version:/ { found = 1 } found && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
          fi
          echo "Expected ${EXPECTED_VERSION}, installed $(crane version)"
          [[ "$(crane version)" == "${EXPECTED_VERSION}" ]]
      - name: Read the source digests
        run: |
          # The tag can move while the job runs, so the rest of the job uses
          # the image it points to now.
          SOURCE_DIGEST=$(crane digest "${SOURCE_IMAGE}")
          SOURCE_REF="${SOURCE_IMAGE%:*}@${SOURCE_DIGEST}"
          SOURCE_ARM64_DIGEST=$(crane digest --platform linux/arm64 "${SOURCE_REF}")
          echo "Source: ${SOURCE_REF}, linux/arm64: ${SOURCE_ARM64_DIGEST}"
          [[ "${SOURCE_DIGEST}" != "${SOURCE_ARM64_DIGEST}" ]]
          {
            echo "SOURCE_DIGEST=${SOURCE_DIGEST}"
            echo "SOURCE_REF=${SOURCE_REF}"
            echo "SOURCE_ARM64_DIGEST=${SOURCE_ARM64_DIGEST}"
          } >> "${GITHUB_ENV}"
      # crane stores no entry without both, so login refuses an empty one
      # before running crane.
      - name: Log in with a password variable that is unset, which must fail
        id: no-password
        continue-on-error: true
        uses: ./actions/login
        with:
          registry: localhost:5000
          username: REGISTRY_USER
          password: CRANE_ORB_CI_UNSET
      - name: Verify the empty password was refused
        env:
          OUTCOME: ${{ steps.no-password.outcome }}
        run: '[[ "${OUTCOME}" == failure ]]'
      - uses: ./actions/login
        with:
          registry: localhost:5000
          username: REGISTRY_USER
          password: REGISTRY_SECRET
      - uses: ./actions/copy
        with:
          source: ${{ env.SOURCE_REF }}
          destination: localhost:5000/crane-orb-ci/static:copied
      - uses: ./actions/digest
        with:
          image: localhost:5000/crane-orb-ci/static:copied
      - name: Verify the copy and the digest
        run: |
          echo "CRANE_DIGEST=${CRANE_DIGEST}"
          echo "CRANE_DIGEST_REF=${CRANE_DIGEST_REF}"
          [[ "${CRANE_DIGEST}" == "${SOURCE_DIGEST}" ]]
          [[ "${CRANE_DIGEST_REF}" == "${REGISTRY_HOST}/crane-orb-ci/static@${SOURCE_DIGEST}" ]]
          REGISTRY_DIGEST=$(curl -sS --fail -u "${REGISTRY_USER}:${REGISTRY_SECRET}" -o /dev/null -D - \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "http://${REGISTRY_HOST}/v2/crane-orb-ci/static/manifests/copied" \
            | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }' | tr -d '\r')
          echo "Registry digest: ${REGISTRY_DIGEST}"
          [[ "${REGISTRY_DIGEST}" == "${SOURCE_DIGEST}" ]]
      - uses: ./actions/copy
        with:
          source: ${{ env.CRANE_DIGEST_REF }}
          destination: localhost:5000/crane-orb-ci/static:arm64
          platform: linux/arm64
      - uses: ./actions/digest
        with:
          image: localhost:5000/crane-orb-ci/static:arm64
          digest_env_var: ARM64_DIGEST
          digest_ref_env_var: ARM64_DIGEST_REF
      - name: Verify the single-platform copy
        run: |
          echo "ARM64_DIGEST=${ARM64_DIGEST}"
          [[ "${ARM64_DIGEST}" == "${SOURCE_ARM64_DIGEST}" ]]
      - uses: ./actions/tag
        with:
          image: ${{ env.CRANE_DIGEST_REF }}
          tags: |
            1.0.0
            latest
      - name: Verify the tags
        run: |
          for tag in 1.0.0 latest; do
            TAG_DIGEST=$(crane digest "${REGISTRY_HOST}/crane-orb-ci/static:${tag}")
            echo "${tag}: ${TAG_DIGEST}"
            [[ "${TAG_DIGEST}" == "${CRANE_DIGEST}" ]]
          done
      - uses: ./actions/logout
        with:
          registry: localhost:5000
      - name: Verify the registry refuses crane after logout
        run: |
          if crane digest "${REGISTRY_HOST}/crane-orb-ci/static:copied"; then
            echo "crane read the registry after logout."
            exit 1
          fi
