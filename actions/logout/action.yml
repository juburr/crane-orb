name: Log out of a registry with crane
description: >
  Removes the credentials login stored for an OCI registry, with crane auth
  logout. Logging out of a registry the job isn't logged in to succeeds. Needs
  crane 0.15.1 or later. The GitHub Actions twin of the orb's logout command.
author: juburr

inputs:
  registry:
    description: >
      Registry host to log out of: the same value login took.
    required: true

runs:
  using: composite
  steps:
    - name: crane Logout
      shell: bash
      env:
        PARAM_REGISTRY: ${{ inputs.registry }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/logout.sh"
        "SCRIPT_CRANE_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/crane.sh"
