description: >
  Mirror a public base image into your own registry, every platform at once,
  so builds don't depend on the public registry's availability or pull
  limits. The source needs no login; the destination does. Copy from the
  registry that publishes the image, not a pull-through cache, which can be
  missing the layers of platforms few people pull.

usage:
  version: 2.1
  orbs:
    crane: juburr/crane-orb@0.2.0
  jobs:
    mirror-base-image:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - crane/install:
            version: "0.22.1"
        - crane/login:
            registry: registry.example.com
        - crane/copy:
            source: cgr.dev/chainguard/static:latest
            destination: registry.example.com/base-images/static:latest
        - crane/logout:
            registry: registry.example.com
  workflows:
    nightly-mirror:
      jobs:
        - mirror-base-image:
            context: registry-credentials
